name: Dilekci World TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Kalici imzalama anahtarini hazirla
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > dilekci.p12
          chmod 600 dilekci.p12
          test -s dilekci.p12

      - name: Temiz ve imzali APK olustur
        env:
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: gradle clean assembleDebug --no-build-cache

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Dilekci-World-TV-Premium-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Gecici anahtar dosyasini temizle
        if: always()
        run: rm -f dilekci.p12